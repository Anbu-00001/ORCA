<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ORCA app icon. The same mark as index.html's header brand-mark,
       scaled 34->512 (x15.0588) and given the hull ground so it reads on
       a light or dark launcher. Brass on hull is the product's own
       palette, not a stock icon. -->
  <rect width="512" height="512" fill="#071c26"/>
  <g transform="scale(15.0588)" fill="none" stroke="#d9b048"
     stroke-width="1.9" stroke-linecap="round">
    <circle cx="17" cy="17" r="15.25" stroke-width="1.3" opacity="0.4"/>
    <path d="M11.5 14.5a5.5 5.5 0 0 1 11 0"/>
    <path d="M6 19.5q2.75-3 5.5 0t5.5 0 5.5 0 5.5 0"/>
    <path d="M6 24.5q2.75-3 5.5 0t5.5 0 5.5 0 5.5 0" opacity="0.6"/>
  </g>
</svg>
