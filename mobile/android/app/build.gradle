plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'org.orca.advisory'
    compileSdk 35

    defaultConfig {
        applicationId "org.orca.advisory"
        minSdk 24          // Android 7.0 -- covers the mid-range Android
                           // phones ORCA's users actually own
        targetSdk 35
        versionCode 3
        versionName "3.0-storm-drift"
    }

    sourceSets {
        main {
            // mobile/seed carries bundle.json, the advisory the APK ships
            // with so it answers on first launch having never seen a
            // network. Regenerate with:
            //   curl -s localhost:8000/bundle -o mobile/seed/bundle.json
            //
            // NOTE: web/ is no longer an asset source. Up to v1 this app
            // was a WebView over web/, which was a fair criticism -- it
            // looked exactly like the website and did nothing a browser
            // could not. v2 is a real Compose UI. web/ stays the browser
            // client; this is the phone client.
            assets.srcDirs += ['../../seed']
        }
    }

    buildFeatures { compose true }

    // JVM unit tests for the pure logic -- the relay's accept/reject rules
    // are safety-relevant and must be testable without two phones and a
    // radio. returnDefaultValues lets android.util.Log no-op instead of
    // throwing; nothing under test depends on its return value.
    testOptions { unitTests.returnDefaultValues = true }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key on purpose: this is a prototype
            // APK for sideloading and demo, not a Play Store artifact.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // Compose, via the BOM so every artifact stays on one version set.
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    testImplementation 'junit:junit:4.13.2'
    // The real org.json, because the Android stub throws on every call and
    // validateReceived() parses untrusted JSON from another boat -- the one
    // thing most worth testing here.
    testImplementation 'org.json:json:20231013'

    // NO appcompat: it drags in kotlin-stdlib-jdk7/jdk8 1.6.21, which
    // collided with the newer stdlib and failed the build on ~20
    // duplicate classes. Compose does not need it.
}
